# toptop-v2 klasörünü GitHub Pages'e yayınlar:
#   /display-deneyim/  2. monitör (deneyim)
#   /display-muhafiz/  1. monitör (İYTE Muhafızı)
#   /quiz-girisimci/   telefon testi
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp -R toptop-v2/display-deneyim toptop-v2/display-muhafiz toptop-v2/quiz-girisimci _site/
          cp toptop-v2/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
