<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Portren · Teknopark İzmir</title>
<style>
  :root { --bg: #0d0f12; --card: #171a1f; --line: #2b3036; --text: #f4f5f7; --muted: #a4a9b2; --green: #80CD36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 Roboto, system-ui, -apple-system, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
  header { color: var(--green); font-weight: 700; letter-spacing: .04em; font-size: 14px; margin-bottom: 12px; }
  img { display: block; width: 100%; border-radius: 16px; border: 1px solid var(--line); background: var(--card); aspect-ratio: 9 / 16; object-fit: cover; }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; font: inherit; font-weight: 700; font-size: 18px;
    padding: 16px; border-radius: 14px; background: var(--green); color: #10140c; margin-top: 14px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  p { color: var(--muted); font-size: 14px; text-align: center; margin: 14px 0 0; }
  .err { text-align: center; padding: 60px 10px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>TEKNOPARK İZMİR</header>
  <div id="box"></div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const img = q.get('img'), name = q.get('n') || '';
  const box = document.getElementById('box');
  // Yalnızca https görseller (paylaşım deposu); başka bir şey gösterme.
  if (!img || !/^https:\/\//.test(img)) {
    box.innerHTML = '<div class="err">Portre bulunamadı. Bağlantı süresi dolmuş olabilir.</div>';
  } else {
    box.innerHTML = `
      <img id="pic" alt="Portren">
      <button class="btn" id="share">Instagram'da paylaş</button>
      <a class="btn ghost" id="dl" download="teknopark-portrem.jpg">Fotoğrafı indir</a>
      <a class="btn" style="background:#f3c969;color:#2b1d00" href="https://teknoparkizmir.com.tr/tr/projeler/teknogirisim-akademisi/">🎟️ Davetiyeni kullan: Teknogirişim Akademisi</a>
      <p>Paylaşırken <b>@teknoparkizmir</b>'i etiketlemeyi unutma! Portren 7 gün sonra silinir.</p>
      <a class="btn ghost" href="./">Testi tekrar çöz</a>`;
    document.getElementById('pic').src = img;
    document.getElementById('dl').href = img;
    document.getElementById('share').addEventListener('click', async () => {
      try {
        const blob = await (await fetch(img)).blob();
        const file = new File([blob], 'teknopark-portrem.jpg', { type: 'image/jpeg' });
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Teknopark İzmir', text: `${name ? name + ' · ' : ''}@teknoparkizmir` });
        } else {
          location.href = img;   // paylaşım menüsü yoksa görseli aç (uzun basıp kaydet)
        }
      } catch (e) {
        if (e.name !== 'AbortError') location.href = img;
      }
    });
  }
</script>
</body>
</html>
